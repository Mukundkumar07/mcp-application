spring.application.name=mcp-application
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8080

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:your-groq-api-key-here}
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.model=llama-3.3-70b-versatile

# Vector Database Configuration (Qdrant)
vector.db.host=localhost
vector.db.port=6333
vector.db.collection=documents
vector.db.enabled=true

# Embedding Configuration
embedding.model.type=local
embedding.model.name=sentence-transformers/all-MiniLM-L6-v2
embedding.dimension=384
embedding.cache.enabled=true

# MCP Configuration
mcp.filesystem.enabled=true
mcp.filesystem.root-path=/Users/mukundkumar/Documents
mcp.filesystem.allowed-extensions=pdf,txt,md,docx,java,py,json,xml,html,css,js

# RAG Configuration
rag.chunk-size=512
rag.chunk-overlap=50
rag.retrieval-top-k=5
rag.max-context-length=4000
